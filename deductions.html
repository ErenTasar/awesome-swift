<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Görevler</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
html,body{overflow:hidden;position:fixed;width:100%;height:100%;background:#000;font-family:-apple-system,'SF Pro Rounded','SF Pro Display',BlinkMacSystemFont,sans-serif}
input::placeholder{color:rgba(255,255,255,.3)}
#root{position:fixed;inset:0}
@keyframes popIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div id="root">
  <div id="appContainer" style="position:fixed;top:0;left:0;right:0;height:100%;background:#000;overflow:hidden;font-family:-apple-system,'SF Pro Rounded','SF Pro Display',BlinkMacSystemFont,sans-serif">
    <div style="position:absolute;left:0;right:0;top:130px">
      <div style="padding:0 20px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between">
        <div>
          <h1 style="font-size:26px;font-weight:700;color:#fff;margin:0;letter-spacing:-.025em">Görevler</h1>
          <p id="subtitle" style="font-size:13.5px;color:rgba(255,255,255,.35);margin:3px 0 0;font-weight:500">← sola çek veya + ile ekle</p>
        </div>
        <button id="addBtn" style="width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <div style="position:relative;padding:10px 0">
        <div id="pullIndicator" style="position:absolute;left:20px;top:50%;margin-top:-24px;z-index:0;width:48px;height:48px;border-radius:14px;border:2px dashed rgba(255,255,255,.15);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;opacity:0;transform:translateX(-56px) scale(.3);transition:border-color .15s,background .15s;pointer-events:none">
          <div class="pull-icon" style="color:rgba(255,255,255,.5);display:flex;transition:color .15s">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </div>
        </div>
        <div id="scrollContainer" style="overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;position:relative;z-index:1;user-select:none;-webkit-user-select:none">
          <div id="track" style="display:flex;padding:0 20px;transition:transform .3s cubic-bezier(.25,1,.5,1)"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
// --- Layout stabilizasyonu: Safari klavye açılınca sayfayı scroll etmesin ---
var appContainer=document.getElementById("appContainer");
var initialHeight=window.innerHeight;
appContainer.style.height=initialHeight+"px";

// Safari sayfayı yukarı kaydırdığında, visualViewport.offsetTop artar.
// Bunu container'ı aşağı kaydırarak telafi ediyoruz.
function compensateScroll(){
if(window.visualViewport){
var offset=window.visualViewport.offsetTop;
appContainer.style.transform="translateY("+offset+"px)";
}
window.scrollTo(0,0);
document.documentElement.scrollTop=0;
document.body.scrollTop=0;
}

if(window.visualViewport){
window.visualViewport.addEventListener("resize",function(){
appContainer.style.height=initialHeight+"px";
compensateScroll();
});
window.visualViewport.addEventListener("scroll",function(){
compensateScroll();
});
}
// Fallback: window scroll'u da engelle
window.addEventListener("scroll",function(){
window.scrollTo(0,0);
compensateScroll();
},{passive:false});

// --- Proxy input: klavye açılması için user gesture zincirinde senkron focus ---
var proxyInput=document.createElement("input");
proxyInput.type="text";proxyInput.inputMode="text";
proxyInput.setAttribute("aria-hidden","true");
proxyInput.tabIndex=-1;
Object.assign(proxyInput.style,{position:"fixed",top:"-9999px",left:"-9999px",opacity:"0",width:"1px",height:"1px",border:"none",padding:"0",margin:"0",pointerEvents:"none"});
document.body.appendChild(proxyInput);

const COLORS=[
{bg:"#7C3AED",accent:"#A78BFA"},
{bg:"#E84545",accent:"#FF8A8A"},
{bg:"#0EA5E9",accent:"#7DD3FC"},
{bg:"#CA8A04",accent:"#FDE047"},
{bg:"#10B981",accent:"#6EE7B7"},
{bg:"#E11D9E",accent:"#F9A8D4"},
{bg:"#6366F1",accent:"#A5B4FC"},
{bg:"#EA580C",accent:"#FDBA74"},
];
const W=168,H=124,R=20,GAP=12,SLOT=W+GAP,TH=68,MAX_PULL=90;
const SCRATCHES=[[15,8,185,132,2.8],[35,3,195,118,2],[8,35,165,137,2.4],[55,0,198,95,1.6],[3,60,145,138,2.2],[75,2,197,78,1.4]];

let todos=[
{id:1,text:"Vergi beyannamesi hazırla",color:COLORS[0]},
{id:2,text:"Danıştay kararlarını incele",color:COLORS[1]},
{id:3,text:"Blog yazısı taslağı",color:COLORS[2]},
{id:4,text:"Müvekkil toplantı notu",color:COLORS[3]},
{id:5,text:"Qdrant index güncelle",color:COLORS[4]},
];
let nextId=6;
let adding=false;
let addingLock=false;
let newCol=null;

const track=document.getElementById("track");
const subtitle=document.getElementById("subtitle");
const addBtn=document.getElementById("addBtn");
const scrollContainer=document.getElementById("scrollContainer");
const pullIndicator=document.getElementById("pullIndicator");

function rndColor(used){
const a=COLORS.filter(c=>!used.includes(c.bg));
const p=a.length?a:COLORS;
return p[Math.floor(Math.random()*p.length)];
}

function createScratchesSVG(accent){
const ns="http://www.w3.org/2000/svg";
const svg=document.createElementNS(ns,"svg");
Object.assign(svg.style,{position:"absolute",inset:"0",width:"100%",height:"100%",opacity:"0.12",pointerEvents:"none"});
svg.setAttribute("viewBox","0 0 200 140");
svg.setAttribute("preserveAspectRatio","none");
SCRATCHES.forEach(([x1,y1,x2,y2,w])=>{
const line=document.createElementNS(ns,"line");
line.setAttribute("x1",x1);line.setAttribute("y1",y1);
line.setAttribute("x2",x2);line.setAttribute("y2",y2);
line.setAttribute("stroke",accent);line.setAttribute("stroke-width",w);
line.setAttribute("stroke-linecap","round");
svg.appendChild(line);
});
return svg;
}

function createCardEl(todo){
// Outer wrapper (handles width collapse animation)
const wrapper=document.createElement("div");
Object.assign(wrapper.style,{width:SLOT+"px",overflow:"hidden",flexShrink:"0"});

// Inner card
const card=document.createElement("div");
Object.assign(card.style,{
width:W+"px",height:H+"px",borderRadius:R+"px",marginRight:GAP+"px",
background:todo.color.bg,position:"relative",overflow:"hidden",
opacity:"1",transform:"scale(1)",
});

card.appendChild(createScratchesSVG(todo.color.accent));

// Content layer
const content=document.createElement("div");
Object.assign(content.style,{position:"relative",zIndex:"1",padding:"12px 14px",height:"100%",display:"flex",flexDirection:"column",justifyContent:"space-between"});

// Check button row
const btnRow=document.createElement("div");
Object.assign(btnRow.style,{display:"flex",justifyContent:"flex-end"});
const checkBtn=document.createElement("button");
Object.assign(checkBtn.style,{
width:"26px",height:"26px",borderRadius:"50%",border:"2px solid rgba(255,255,255,.28)",
background:"rgba(255,255,255,.08)",display:"flex",alignItems:"center",justifyContent:"center",
cursor:"pointer",padding:"0",transition:"background .15s,border-color .15s",
});
checkBtn.innerHTML='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
checkBtn.addEventListener("click",function(e){
e.stopPropagation();
startRemoveAnimation(wrapper,card,todo.id);
});
btnRow.appendChild(checkBtn);
content.appendChild(btnRow);

// Text area
const textDiv=document.createElement("div");
Object.assign(textDiv.style,{
fontWeight:"600",fontSize:"15.5px",color:"#fff",lineHeight:"1.22",letterSpacing:"-.01em",
display:"-webkit-box",WebkitLineClamp:"2",WebkitBoxOrient:"vertical",
overflow:"hidden",textOverflow:"ellipsis",wordBreak:"break-all",cursor:"text",
});
textDiv.textContent=todo.text;
textDiv.addEventListener("click",function(e){
e.stopPropagation();
startEditing(content,textDiv,todo);
});
content.appendChild(textDiv);

card.appendChild(content);
wrapper.appendChild(card);
return wrapper;
}

function startEditing(content,textDiv,todo){
const input=document.createElement("input");
input.type="text";input.inputMode="text";input.enterKeyHint="done";
input.autocomplete="off";input.value=todo.text;
Object.assign(input.style,{
fontWeight:"600",fontSize:"16px",color:"#fff",lineHeight:"1.22",letterSpacing:"-.01em",
background:"rgba(0,0,0,.15)",border:"none",borderRadius:"6px",outline:"none",
padding:"2px 4px",margin:"-2px -4px",width:"calc(100% + 8px)",caretColor:"#fff",fontFamily:"inherit",
});

let committed=false;
function commit(){
if(committed)return;committed=true;
const v=(input.value||"").trim();
if(v&&v!==todo.text){
todo.text=v;
}
// Replace input with text div
const newTextDiv=document.createElement("div");
Object.assign(newTextDiv.style,{
fontWeight:"600",fontSize:"15.5px",color:"#fff",lineHeight:"1.22",letterSpacing:"-.01em",
display:"-webkit-box",WebkitLineClamp:"2",WebkitBoxOrient:"vertical",
overflow:"hidden",textOverflow:"ellipsis",wordBreak:"break-all",cursor:"text",
});
newTextDiv.textContent=todo.text;
newTextDiv.addEventListener("click",function(e){
e.stopPropagation();
startEditing(content,newTextDiv,todo);
});
content.replaceChild(newTextDiv,input);
}

input.addEventListener("keydown",function(e){
if(e.key==="Enter"){e.preventDefault();commit();}
if(e.key==="Escape"){committed=true;content.replaceChild(textDiv,input);}
});
input.addEventListener("blur",function(){setTimeout(commit,150);});

content.replaceChild(input,textDiv);
input.focus({preventScroll:true});
input.setSelectionRange(0,input.value.length);
window.scrollTo(0,0);
}

function startRemoveAnimation(wrapper,card,id){
// Stage 1: fade out + shrink
requestAnimationFrame(function(){
Object.assign(card.style,{
opacity:"0",
transform:"scale(.8) translateY(-6px)",
transition:"opacity .28s ease, transform .28s cubic-bezier(.4,0,.2,1)",
});
});

// Stage 2: collapse width
setTimeout(function(){
wrapper.style.transition="width .32s cubic-bezier(.4,0,.2,1)";
wrapper.style.width="0px";
wrapper.addEventListener("transitionend",function handler(e){
if(e.propertyName==="width"){
wrapper.removeEventListener("transitionend",handler);
todos=todos.filter(t=>t.id!==id);
wrapper.remove();
updateSubtitle();
if(todos.length===0&&!adding)showEmptyState();
}
});
},280);
}

function showEmptyState(){
// Remove existing empty state if any
const existing=track.querySelector(".empty-state");
if(existing)existing.remove();

const empty=document.createElement("div");
empty.className="empty-state";
Object.assign(empty.style,{
width:W+"px",height:H+"px",borderRadius:R+"px",flexShrink:"0",
border:"2px dashed rgba(255,255,255,.08)",display:"flex",alignItems:"center",
justifyContent:"center",flexDirection:"column",gap:"6px",
});
empty.innerHTML='<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg><span style="font-size:12px;color:rgba(255,255,255,.15);font-weight:600">Harika!</span>';
// Also add spacer
const spacer=document.createElement("div");
Object.assign(spacer.style,{width:"20px",flexShrink:"0"});
track.appendChild(empty);
track.appendChild(spacer);
}

function removeEmptyState(){
const existing=track.querySelector(".empty-state");
if(existing)existing.remove();
}

function updateSubtitle(){
if(todos.length===0&&!adding){
subtitle.textContent="Hepsini tamamladın!";
}else{
subtitle.textContent="← sola çek veya + ile ekle";
}
}

function createNewCardEl(color){
const wrapper=document.createElement("div");
Object.assign(wrapper.style,{
width:W+"px",height:H+"px",borderRadius:R+"px",marginRight:GAP+"px",
background:color.bg,position:"relative",overflow:"hidden",flexShrink:"0",
animation:"popIn .26s cubic-bezier(.34,1.56,.64,1) both",
});
wrapper.className="new-card";

wrapper.appendChild(createScratchesSVG(color.accent));

const content=document.createElement("div");
Object.assign(content.style,{position:"relative",zIndex:"1",padding:"12px 14px",height:"100%",display:"flex",flexDirection:"column",justifyContent:"flex-end"});

const input=document.createElement("input");
input.type="text";input.inputMode="text";input.enterKeyHint="done";
input.autocomplete="off";input.spellcheck=false;
input.placeholder="Görev adı...";
Object.assign(input.style,{
fontWeight:"600",fontSize:"16px",color:"#fff",lineHeight:"1.22",letterSpacing:"-.01em",
background:"transparent",border:"none",outline:"none",padding:"0",margin:"0",width:"100%",
caretColor:"transparent",fontFamily:"inherit",
});
setTimeout(function(){input.style.caretColor="#fff";},280);

let submitted=false;
function submit(){
if(submitted)return;submitted=true;
const v=(input.value||"").trim();
if(v){
addTodo(v,color);
}else{
cancelAdding();
}
}

input.addEventListener("keydown",function(e){
if(e.key==="Enter"){e.preventDefault();submit();}
if(e.key==="Escape"){submitted=true;cancelAdding();}
});
input.addEventListener("blur",function(){setTimeout(submit,250);});

content.appendChild(input);
wrapper.appendChild(content);

// Focus transfer: proxy zaten klavyeyi açtı, şimdi gerçek input'a geç
requestAnimationFrame(function(){
input.focus({preventScroll:true});
window.scrollTo(0,0);
});

return wrapper;
}

function addTodo(text,color){
const todo={id:nextId++,text:text,color:color};
todos.unshift(todo);
adding=false;addingLock=false;newCol=null;

// Remove new card
const nc=track.querySelector(".new-card");
if(nc)nc.remove();

removeEmptyState();
renderAll();
updateSubtitle();
}

function cancelAdding(){
adding=false;addingLock=false;newCol=null;
const nc=track.querySelector(".new-card");
if(nc)nc.remove();
updateSubtitle();
if(todos.length===0)showEmptyState();
}

function doAdd(){
if(addingLock)return;
// Senkron proxy focus — user gesture zincirinde klavyeyi aktifleştirir
proxyInput.focus({preventScroll:true});
addingLock=true;adding=true;
const usedColors=todos.map(t=>t.color.bg);
newCol=rndColor(usedColors);

removeEmptyState();

// Insert new card at beginning of track
const newCardEl=createNewCardEl(newCol);
track.insertBefore(newCardEl,track.firstChild);
updateSubtitle();
}

function renderAll(){
track.innerHTML="";

if(todos.length===0&&!adding){
showEmptyState();
}else{
todos.forEach(function(todo){
track.appendChild(createCardEl(todo));
});
// Spacer
const spacer=document.createElement("div");
Object.assign(spacer.style,{width:"20px",flexShrink:"0"});
track.appendChild(spacer);
}
updateSubtitle();
}

// + button
addBtn.addEventListener("click",doAdd);

// Pull-to-add helpers
function dampedPull(rawDx){const l=rawDx*0.55;return l<=MAX_PULL?l:MAX_PULL+(l-MAX_PULL)*0.15;}

function updateIndicator(pullVal){
const el=pullIndicator;
const p=Math.min(pullVal/TH,1);const on=p>.85;const s=.3+p*.7;
el.style.opacity=String(Math.min(p*1.5,1));
el.style.transform="translateX("+Math.min(pullVal-56,4)+"px) scale("+s+")";
const icon=el.querySelector(".pull-icon");
if(icon){icon.style.transform="rotate("+p*90+"deg)";icon.style.color=on?"#A78BFA":"rgba(255,255,255,.5)";}
el.style.borderColor=on?"rgba(167,139,250,.6)":"rgba(255,255,255,.15)";
el.style.background=on?"rgba(124,58,237,.25)":"rgba(255,255,255,.05)";
}

function resetVisuals(){
track.style.transform="";
track.style.transition="transform .3s cubic-bezier(.25,1,.5,1)";
pullIndicator.style.opacity="0";
pullIndicator.style.transform="translateX(-56px) scale(.3)";
}

// Touch gesture
let g={active:false};

scrollContainer.addEventListener("touchstart",function(e){
if(e.target.closest("button")||e.target.closest("input"))return;
const t=e.touches[0];
g={active:true,pulling:false,startX:t.clientX,startY:t.clientY,axis:null};
},{passive:true});

scrollContainer.addEventListener("touchmove",function(e){
if(!g.active)return;
const t=e.touches[0];
const dx=t.clientX-g.startX,dy=t.clientY-g.startY;
if(!g.axis){if(Math.abs(dx)<4&&Math.abs(dy)<4)return;g.axis=Math.abs(dx)>=Math.abs(dy)?"x":"y";}
if(g.axis==="y")return;
if(!g.pulling&&scrollContainer.scrollLeft<2&&dx>4)g.pulling=true;
if(g.pulling){
e.preventDefault();g.pullVal=dampedPull(Math.max(0,dx));
track.style.transform="translateX("+g.pullVal+"px)";
track.style.transition="none";
updateIndicator(g.pullVal);
}
},{passive:false});

scrollContainer.addEventListener("touchend",function(){
if(!g.active)return;
if(g.pulling&&(g.pullVal||0)>TH)doAdd();
resetVisuals();g={active:false};
},{passive:true});

scrollContainer.addEventListener("touchcancel",function(){
if(!g.active)return;
resetVisuals();g={active:false};
},{passive:true});

// Mouse gesture
scrollContainer.addEventListener("mousedown",function(e){
if(e.target.closest("button")||e.target.closest("input"))return;
g={active:true,pulling:false,startX:e.clientX,axis:"x",mouse:true,sl:scrollContainer.scrollLeft||0};
e.preventDefault();
});

window.addEventListener("mousemove",function(e){
if(!g.active||!g.mouse)return;
const dx=e.clientX-g.startX;
if(!g.pulling&&g.sl<2&&dx>4)g.pulling=true;
if(g.pulling){
g.pullVal=dampedPull(Math.max(0,dx));
track.style.transform="translateX("+g.pullVal+"px)";
track.style.transition="none";
updateIndicator(g.pullVal);
}else{
scrollContainer.scrollLeft=g.sl-dx;
}
});

window.addEventListener("mouseup",function(){
if(!g.active||!g.mouse)return;
if(g.pulling&&(g.pullVal||0)>TH)doAdd();
resetVisuals();g={active:false};
});

// Initial render
renderAll();

})();
</script>
</body>
</html>
