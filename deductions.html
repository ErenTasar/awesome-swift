:root {
  --bg-deep: #0a0a0f;
  --bg-surface: #131320;
  --bg-surface-hover: #1a1a2c;
  --text-primary: #e8e4dc;
  --text-secondary: #9a9484;
  --text-muted: #504e48;
  --accent-gold: #c9a84c;
  --accent-gold-dim: rgba(201, 168, 76, 0.12);
  --accent-red: #8b3a3a;
  --accent-red-dim: rgba(139, 58, 58, 0.12);
  --border: #252535;
  --border-active: rgba(201, 168, 76, 0.5);
  --font-serif: 'Playfair Display', Georgia, serif;
  --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;

  /* Golden ratio type scale: φ = 1.618 */
  --fs-label: 0.56rem;     /* ÷φ from body — labels, eyebrows */
  --fs-body: 0.9rem;       /* base — clue cards, deductions */
  --fs-prose: 1.05rem;     /* ×√φ — story text */
  --fs-chapter: 1.45rem;   /* ×φ — chapter titles */
  --fs-display: 2.35rem;   /* ×φ² — title screen */
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

#app {
  max-width: 480px;
  margin: 0 auto;
  height: 100dvh;
  height: 100vh;
  position: relative;
  overflow: hidden;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

#app::before {
  content: '';
  position: fixed; inset: 0; z-index: 100;
  pointer-events: none; opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 128px 128px;
}

#app::after {
  content: '';
  position: fixed; inset: 0; z-index: 99;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 50%, transparent 50%, rgba(0,0,0,0.4) 100%);
}

.screen { display: none; flex-direction: column; height: 100%; }
.screen.active { display: flex; }

/* ═══════ TITLE ═══════ */
#screen-title {
  justify-content: center; align-items: center; text-align: center;
  padding: 2rem;
  animation: fadeIn 1.5s ease;
  background: radial-gradient(ellipse at 50% 38%, #161628 0%, var(--bg-deep) 70%);
}
.eyebrow {
  font-family: var(--font-sans);
  font-size: var(--fs-label); font-weight: 600;
  letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--accent-gold); margin-bottom: 1rem;
}
#screen-title h1 {
  font-family: var(--font-serif);
  font-size: var(--fs-display); font-weight: 700;
  line-height: 1.12; margin-bottom: 0.4rem;
}
#screen-title .subtitle {
  font-family: var(--font-serif); font-style: italic;
  font-size: var(--fs-body); color: var(--text-secondary);
  margin-bottom: 3rem;
}
.btn-primary {
  font-family: var(--font-sans);
  font-size: var(--fs-label); font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--bg-deep); background: var(--accent-gold);
  border: none; padding: 0.85rem 2rem; border-radius: 3px;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.btn-primary:active { opacity: 0.8; transform: scale(0.97); }

/* ═══════ GAME ═══════ */
#screen-game { padding: 0; position: relative; }

#story-panel {
  padding: 0.9rem 1.15rem 0.65rem;
  flex-shrink: 0;
  max-height: 30vh;
  overflow-y: auto;
  scroll-behavior: smooth;
  border-bottom: 1px solid var(--border);
  -webkit-overflow-scrolling: touch;
}
#story-panel::-webkit-scrollbar { width: 2px; }
#story-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.scene-label {
  font-family: var(--font-sans);
  font-size: var(--fs-label); font-weight: 600;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--accent-gold); margin-bottom: 0.45rem;
}
.story-text {
  font-family: var(--font-serif);
  font-size: var(--fs-prose); line-height: 1.7;
  color: var(--text-primary);
}
.story-text .line {
  display: inline;
  opacity: 0; transition: opacity 0.5s ease;
}
.story-text .line.visible { opacity: 1; }

.story-update {
  display: block;
  font-family: var(--font-serif); font-style: italic;
  font-size: var(--fs-body); line-height: 1.55;
  color: var(--text-secondary);
  margin-top: 0.2rem; padding-left: 0.6rem;
  border-left: 1px solid rgba(201,168,76,0.2);
  opacity: 0; transform: translateY(4px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.story-update.visible { opacity: 1; transform: translateY(0); }

/* Deduction panel */
#deduction-panel {
  max-height: 0; overflow: hidden;
  transition: max-height 0.4s ease, padding 0.4s ease;
  padding: 0 1.15rem; flex-shrink: 0;
}
#deduction-panel.show { max-height: 180px; padding: 0.55rem 1.15rem; }

.deduction-box {
  padding: 0.6rem 0.85rem; border-radius: 3px;
  font-size: var(--fs-body); line-height: 1.6;
  font-family: var(--font-serif);
  overflow-y: auto;
  max-height: 150px;
}
.deduction-box.correct {
  background: rgba(201, 168, 76, 0.04);
  border-left: 2px solid var(--accent-gold);
  color: var(--text-primary);
  animation: thoughtAppear 0.5s ease forwards;
}
.deduction-box.wrong {
  background: var(--accent-red-dim);
  border-left: 2px solid var(--accent-red);
  color: var(--text-secondary);
  animation: thoughtAppear 0.4s ease forwards;
}

/* ═══════ CLUES ═══════ */
#clues-panel {
  flex: 1; display: flex; gap: 0.5rem;
  padding: 0.5rem 0.65rem;
  overflow: hidden; min-height: 0;
}
.clue-column {
  flex: 1; display: flex; flex-direction: column;
  gap: 0.45rem;
  min-height: 0;
}

.clue {
  display: flex; align-items: center;
  width: 100%;
  flex: 1 1 0;
  min-height: 0;
  font-family: var(--font-sans);
  font-size: var(--fs-body); font-weight: 400;
  line-height: 1.45;
  color: var(--text-primary);
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-left: 2px solid var(--border);
  border-radius: 6px;
  padding: 0.5rem 0.65rem;
  cursor: pointer; text-align: left;
  box-shadow: 0 1px 4px rgba(0,0,0,0.25);
  transition: border-color 0.3s, background 0.3s, transform 0.15s,
              opacity 0.5s ease, box-shadow 0.3s;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  word-break: break-word;
}
.clue:active:not(.locked) { transform: scale(0.97); }

.clue.selected {
  border-left-color: var(--accent-gold);
  border-color: var(--border-active);
  background: var(--accent-gold-dim);
  box-shadow: 0 2px 12px rgba(0,0,0,0.3), 0 0 16px rgba(201,168,76,0.06);
}
.clue.matched {
  border-left-color: var(--accent-gold);
  border-color: var(--accent-gold);
  box-shadow: 0 0 14px rgba(201,168,76,0.25);
  background: rgba(201,168,76,0.08);
}
.clue.locked {
  pointer-events: none;
  background: rgba(10, 10, 15, 0.6);
  border-color: rgba(37, 37, 53, 0.3);
  border-left-color: rgba(37, 37, 53, 0.3);
  box-shadow: none;
}
.clue.locked .clue-text {
  display: none;
}
.clue.locked .clue-placeholder {
  display: block;
  color: var(--text-muted);
  font-size: var(--fs-label);
  letter-spacing: 0.15em;
  opacity: 0.4;
}
.clue .clue-placeholder { display: none; }

.clue.unlocking {
  animation: unlockPulse 0.8s ease forwards;
}
.clue.shake { animation: shakeX 0.35s ease; }
.clue.wrong-flash {
  border-left-color: var(--accent-red);
  background: var(--accent-red-dim);
}

/* ═══════ PROGRESS ═══════ */
#progress-bar {
  display: flex; align-items: center; justify-content: center;
  gap: 0.3rem; padding: 0.55rem 1rem;
  flex-shrink: 0; border-top: 1px solid var(--border);
}
.progress-chapter {
  font-family: var(--font-serif);
  font-size: calc(var(--fs-label) * 1.2); color: var(--accent-gold);
  margin-right: 0.35rem; font-weight: 700;
}
.progress-pip {
  width: 20px; height: 3px;
  border-radius: 1.5px; background: var(--border);
  transition: background 0.4s ease, box-shadow 0.4s ease;
}
.progress-pip.filled {
  background: var(--accent-gold);
  box-shadow: 0 0 5px rgba(201,168,76,0.3);
}

/* ═══════ SCENE FADE ═══════ */
#scene-fade {
  position: absolute; inset: 0;
  background: #000; z-index: 10;
  opacity: 0; pointer-events: none;
  transition: opacity 0.8s ease;
  display: flex; justify-content: center; align-items: center;
}
#scene-fade.active { opacity: 1; pointer-events: auto; }
#scene-fade .chapter-title {
  font-family: var(--font-serif);
  font-size: var(--fs-chapter); color: var(--accent-gold);
  opacity: 0; transition: opacity 0.8s ease;
  text-align: center; padding: 0 2rem;
}
#scene-fade.show-title .chapter-title { opacity: 1; }

/* ═══════ REVEAL ═══════ */
#screen-reveal {
  justify-content: flex-start; align-items: center;
  text-align: center; padding: 2.5rem 1.5rem 2rem;
  background: #000; animation: revealBg 2s ease forwards;
  overflow-y: auto;
}
.reveal-label {
  font-family: var(--font-sans);
  font-size: var(--fs-label); font-weight: 600;
  letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--accent-gold); margin-bottom: 1.5rem;
  opacity: 0; animation: fadeIn 1s ease 0.3s forwards;
}
#reveal-text {
  font-family: var(--font-serif);
  font-size: var(--fs-body); line-height: 1.8;
  color: var(--text-primary);
  max-width: 380px; text-align: left;
}
#reveal-text strong { color: var(--accent-gold); }
#reveal-text p { margin-bottom: 0.9rem; }
#btn-replay {
  margin-top: 2rem; opacity: 0;
  transition: opacity 0.6s ease; flex-shrink: 0;
}
#btn-replay.show { opacity: 1; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes thoughtAppear {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes shakeX {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-3px); }
  75% { transform: translateX(3px); }
}
@keyframes revealBg { from { background: #000; } to { background: var(--bg-deep); } }
@keyframes unlockPulse {
  0% { background: rgba(10,10,15,0.6); border-color: rgba(37,37,53,0.3); border-left-color: rgba(37,37,53,0.3); }
  50% { border-color: var(--accent-gold); border-left-color: var(--accent-gold); background: rgba(201,168,76,0.06); }
  100% { background: var(--bg-surface); border-color: var(--border); border-left-color: var(--border); }
}

const REVEAL_TEXT = `<p>Kerem Arslantürk'ü öldüren üç kişilik bir zincirdi.</p>
<p><strong>Doğan Kıray</strong> — 15 yıldır sahte tabloları orijinal diye satan, 40 milyon euroluk bir imparatorluğun sahibi. Kerem'in İnterpol'e başvuracağını öğrenince emri verdi.</p>
<p><strong>İlhan Soylu</strong> — Kerem'in eski öğrencisi, sahte tabloların yaratıcısı. Dozajı hesaplattı, o gece yalıya gizlice gelip sahneyi 'kalp krizi' olarak düzenledi. Her sahte tabloya koyduğu monogram — sonu oldu.</p>
<p><strong>Canan Demirtaş</strong> — İlhan'ın sevgilisi, Kerem'in asistanı. Seradaki Vadinin Zambağı'ndan konvallatoksin özütü hazırladı, papatya çayına karıştırdı. İki hafta öncesinden zehrin tespit edilip edilemeyeceğini araştırmıştı.</p>
<p>Mediha yıllardır biliyordu ama sustu — Doğan'ın paraları yalının bakımını karşılıyordu. Kaptan Hasan, parayla susturuldu.</p>
<p>Zeynep başlangıçta belgeleri kendi çıkarı için kullanmayı düşünmüştü. Ama babasının ses kaydını dinlediğinde her şey değişti.</p>
<p>Kerem, ölümünden önce bir kayıt bırakmıştı. Son sözleri kızınaydı:</p>
<p><strong>"Bunu sana emanet ediyorum, Zeynep."</strong></p>
<p>Ve Zeynep, son dokunuşu yaptı.</p>`;


// ═══════ ENGINE ═══════
const S = { scene:0, selLeft:null, solved:[[],[],[],[],[]], animating:false, rightOrder:[], storyUpdates:[[],[],[],[],[]] };
const $ = id => document.getElementById(id);

function shuffle(a) {
  const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b;
}

function showScreen(n) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $('screen-'+n).classList.add('active');
}

function startGame() {
  S.scene=0; S.selLeft=null;
  S.solved=[[],[],[],[],[]]; S.storyUpdates=[[],[],[],[],[]];
  S.rightOrder=[]; for(let i=0;i<5;i++) S.rightOrder.push(shuffle([0,1,2,3,4]));
  showScreen('game'); renderScene(); animateStory();
}

function solvedMatchIndices(si) {
  const sc=SCENES[si];
  return S.solved[si].map(s => sc.matches.findIndex(m=>m.l===s.l&&m.r===s.r));
}

function getLockedClues(si) {
  const sc=SCENES[si], smi=solvedMatchIndices(si);
  const lL=new Set(), rL=new Set();
  sc.matches.forEach((m,i)=>{
    if(m.requires!==undefined && !smi.includes(m.requires)){
      lL.add(m.l); rL.add(m.r);
    }
  });
  return {lL,rL};
}

// Calculate reading time: ~2.5 words/sec for careful reader + buffer
function readingTime(text) {
  const words = text.split(/\s+/).length;
  return Math.max(4500, words * 420 + 1800);
}

function renderScene() {
  $('scene-label').textContent=SCENES[S.scene].title;
  renderClues(); renderProgress(); renderStoryUpdates();
}

function animateStory() {
  const sc=SCENES[S.scene], el=$('story-text');
  const sents=sc.story.split('. ').map((s,i,a)=>i<a.length-1?s+'.':s);
  el.innerHTML=sents.map(s=>`<span class="line">${s} </span>`).join('');
  $('story-updates').innerHTML='';
  el.querySelectorAll('.line').forEach((l,i)=>setTimeout(()=>l.classList.add('visible'),100*(i+1)));
}

function renderStoryUpdates() {
  const c=$('story-updates'); c.innerHTML='';
  S.storyUpdates[S.scene].forEach(t=>{
    const d=document.createElement('div');
    d.className='story-update visible'; d.textContent=t; c.appendChild(d);
  });
}

function addStoryUpdate(text) {
  S.storyUpdates[S.scene].push(text);
  const d=document.createElement('div');
  d.className='story-update'; d.textContent=text;
  $('story-updates').appendChild(d);
  requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('visible')));
  setTimeout(()=>$('story-panel').scrollTo({top:$('story-panel').scrollHeight,behavior:'smooth'}),120);
}

function renderClues() {
  const sc=SCENES[S.scene], solved=S.solved[S.scene], {lL,rL}=getLockedClues(S.scene);
  renderCol('col-left',sc.left,'left',[0,1,2,3,4],solved,lL);
  renderCol('col-right',sc.right,'right',S.rightOrder[S.scene],solved,rL);
}

function renderCol(colId,items,side,order,solved,lockedSet) {
  const col=$(colId);
  const prevLocked = col.dataset.locked ? new Set(col.dataset.locked.split(',').filter(x=>x).map(Number)) : new Set();
  col.innerHTML='';

  order.forEach(idx=>{
    if(solved.some(m=>(side==='left'?m.l:m.r)===idx)) return;
    const isLocked=lockedSet.has(idx);
    const wasLocked=prevLocked.has(idx);
    const btn=document.createElement('button');
    btn.className='clue';
    btn.dataset.side=side; btn.dataset.index=idx;

    // Text span and placeholder span
    const textSpan = document.createElement('span');
    textSpan.className = 'clue-text';
    textSpan.textContent = items[idx];

    const placeholderSpan = document.createElement('span');
    placeholderSpan.className = 'clue-placeholder';
    placeholderSpan.textContent = '· · ·';

    btn.appendChild(textSpan);
    btn.appendChild(placeholderSpan);

    if(isLocked) {
      btn.classList.add('locked');
    } else if(wasLocked) {
      btn.classList.add('unlocking');
    }
    if(!isLocked && side==='left' && S.selLeft===idx) btn.classList.add('selected');
    col.appendChild(btn);
  });

  col.dataset.locked = [...lockedSet].join(',');
}

function renderProgress() {
  const bar=$('progress-bar'); bar.innerHTML='';
  const ch=document.createElement('span');
  ch.className='progress-chapter';
  ch.textContent=['I','II','III','IV','V'][S.scene];
  bar.appendChild(ch);
  for(let i=0;i<5;i++){
    const p=document.createElement('span');
    p.className='progress-pip';
    if(i<S.solved[S.scene].length) p.classList.add('filled');
    bar.appendChild(p);
  }
}

function showDeduction(t,type){
  $('deduction-box').className='deduction-box '+type;
  $('deduction-box').textContent=t;
  $('deduction-panel').classList.add('show');
}
function hideDeduction(){$('deduction-panel').classList.remove('show');}
function vibrate(p){try{navigator.vibrate?.(p);}catch(e){}}

function handleTap(side,index) {
  if(S.animating) return;
  const sc=SCENES[S.scene], solved=S.solved[S.scene], {lL,rL}=getLockedClues(S.scene);
  if(side==='left'&&lL.has(index)) return;
  if(side==='right'&&rL.has(index)) return;
  if(solved.some(m=>(side==='left'?m.l:m.r)===index)) return;

  if(side==='left'){
    S.selLeft=(S.selLeft===index)?null:index;
    hideDeduction(); renderClues(); return;
  }
  if(S.selLeft===null) return;

  const li=S.selLeft;
  const match=sc.matches.find(m=>m.l===li&&m.r===index);

  if(match){
    S.animating=true; S.selLeft=null; vibrate(10);
    const lc=document.querySelector(`.clue[data-side="left"][data-index="${li}"]`);
    const rc=document.querySelector(`.clue[data-side="right"][data-index="${index}"]`);
    if(lc){lc.classList.remove('selected');lc.classList.add('matched');}
    if(rc) rc.classList.add('matched');

    const showDelay = 500;
    const readTime = readingTime(match.text);
    const totalTime = showDelay + readTime;

    setTimeout(()=>showDeduction(match.text,'correct'), showDelay);

    setTimeout(()=>{
      S.solved[S.scene].push({l:li,r:index});
      addStoryUpdate(match.storyUpdate);
      hideDeduction();
      renderClues(); renderProgress();
      S.animating=false;
      if(S.solved[S.scene].length===5) onSceneComplete();
    }, totalTime);
  } else {
    S.animating=true;
    const key=`${li}-${index}`;
    const explanation=sc.wrongs[key]||sc.wrongFallback;
    vibrate([30,50,30]);
    const lc=document.querySelector(`.clue[data-side="left"][data-index="${li}"]`);
    const rc=document.querySelector(`.clue[data-side="right"][data-index="${index}"]`);
    if(lc) lc.classList.add('shake','wrong-flash');
    if(rc) rc.classList.add('shake','wrong-flash');
    showDeduction(explanation,'wrong');

    const wrongReadTime = Math.max(2500, readingTime(explanation) * 0.7);
    setTimeout(()=>{
      if(lc) lc.classList.remove('shake','wrong-flash');
      if(rc) rc.classList.remove('shake','wrong-flash');
      hideDeduction(); S.selLeft=null; S.animating=false; renderClues();
    }, wrongReadTime);
  }
}

function onSceneComplete() {
  if(S.scene<4){
    setTimeout(()=>{
      const fade=$('scene-fade');
      fade.classList.add('active');
      setTimeout(()=>{
        $('chapter-title-text').textContent=SCENES[S.scene+1].title;
        fade.classList.add('show-title');
      },700);
      setTimeout(()=>fade.classList.remove('show-title'),2200);
      setTimeout(()=>{
        S.scene++; S.selLeft=null;
        renderScene(); fade.classList.remove('active'); animateStory();
      },2800);
    },700);
  } else {
    setTimeout(()=>{
      showScreen('reveal');
      setTimeout(typeReveal,1000);
    },800);
  }
}

function typeReveal() {
  const el=$('reveal-text'); el.innerHTML='';
  const chars=REVEAL_TEXT.split('');
  let i=0,inTag=false,buf='';
  function tick(){
    if(i>=chars.length){el.innerHTML=buf;setTimeout(()=>$('btn-replay').classList.add('show'),800);return;}
    const c=chars[i];
    if(c==='<') inTag=true;
    if(inTag){buf+=c;if(c==='>'){inTag=false;el.innerHTML=buf;}i++;tick();return;}
    buf+=c; el.innerHTML=buf; i++; setTimeout(tick,18);
  }
  tick();
}

function resetGame(){$('btn-replay').classList.remove('show');$('reveal-text').innerHTML='';showScreen('title');}

$('clues-panel').addEventListener('click',e=>{
  const c=e.target.closest('.clue');
  if(!c) return;
  handleTap(c.dataset.side,parseInt(c.dataset.index));
});
</script>
